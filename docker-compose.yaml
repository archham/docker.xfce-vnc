version: '3.8'

services:
  xfce-vnc:
    image: archham/xfce-vnc:latest
    container_name: xfce-vnc-desktop
    restart: unless-stopped
    environment:
      - VNC_PW=${VNC_PASSWORD:-secure123}
      - DEBUG=${DEBUG:-false}
      - VNC_RESOLUTION=${VNC_RESOLUTION:-1920x1080}
      - VNC_COL_DEPTH=${VNC_COL_DEPTH:-24}
    ports:
      - "${VNC_PORT:-5902}:5901"
      - "${NOVNC_PORT:-6902}:6901"
    volumes:
      - xfce-data:/headless
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6901/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    shm_size: 2gb
    security_opt:
      - seccomp:unconfined

volumes:
  xfce-data:
